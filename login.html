<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>เข้าสู่ระบบ | VINKO WOW LAB</title>
<meta content="noindex, nofollow" name="robots"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet"/>
<link href="/assets/css/main.css" rel="stylesheet"/>
<style>
.login-wrap {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  background: linear-gradient(135deg, #071B5D 0%, #0d2a82 100%);
}
.login-card {
  background: #fff;
  border-radius: 20px;
  padding: 36px 32px 32px;
  max-width: 420px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.login-logo {
  text-align: center;
  margin-bottom: 28px;
}
.login-logo img { width: 60px; height: 60px; object-fit: contain; }
.login-logo h1 {
  font-family: 'Mitr', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: #071B5D;
  margin: 8px 0 4px;
}
.login-logo p {
  font-family: 'Anuphan', sans-serif;
  font-size: 14px;
  color: #888;
  margin: 0;
}
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 24px 0;
  color: #bbb;
  font-size: 13px;
  font-family: 'Anuphan', sans-serif;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: #e8e8e8;
}
.btn-line-login {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  padding: 14px;
  background: #06C755;
  color: #fff;
  font-family: 'Mitr', sans-serif;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  text-decoration: none;
  transition: background .2s, transform .1s;
}
.btn-line-login:hover { background: #05b34b; }
.btn-line-login:active { transform: scale(0.98); }
.btn-line-login svg { flex-shrink: 0; }
.email-section label {
  display: block;
  font-family: 'Anuphan', sans-serif;
  font-size: 14px;
  color: #444;
  margin-bottom: 8px;
  font-weight: 500;
}
.email-section input[type="email"] {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
  font-family: 'Anuphan', sans-serif;
  color: #222;
  outline: none;
  box-sizing: border-box;
  transition: border-color .2s;
}
.email-section input[type="email"]:focus { border-color: #071B5D; }
.btn-magic {
  width: 100%;
  padding: 14px;
  background: #071B5D;
  color: #fff;
  font-family: 'Mitr', sans-serif;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin-top: 12px;
  transition: background .2s;
}
.btn-magic:hover { background: #0d2a82; }
.btn-magic:disabled { background: #aaa; cursor: not-allowed; }
.msg-box {
  padding: 12px 16px;
  border-radius: 10px;
  font-family: 'Anuphan', sans-serif;
  font-size: 14px;
  margin-top: 16px;
  display: none;
}
.msg-box.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
.msg-box.error   { background: #fce4ec; color: #c62828; border: 1px solid #ef9a9a; }
.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  font-family: 'Anuphan', sans-serif;
  font-size: 13px;
  color: #888;
  text-decoration: none;
}
.back-link:hover { color: #071B5D; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo">
      <img src="/assets/img/vinko-logo.webp" alt="VINKO Logo"/>
      <h1>VINKO · WOW LAB</h1>
      <p>เข้าสู่ระบบเพื่อดูหนังสือของคุณ</p>
    </div>

    <!-- LINE Login -->
    <button type="button" class="btn-line-login" id="btn-line" onclick="beginLineLogin()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
      </svg>
      เข้าสู่ระบบด้วย LINE
    </button>

    <div class="divider">หรือ</div>

    <!-- Magic link -->
    <div class="email-section">
      <label for="email-input">อีเมลที่ใช้สั่งซื้อ</label>
      <input type="email" id="email-input" placeholder="your@email.com" autocomplete="email"/>
      <button class="btn-magic" id="btn-magic" onclick="sendMagicLink()">
        รับลิงก์เข้าสู่ระบบทางอีเมล
      </button>
    </div>

    <div class="msg-box" id="msg-box"></div>

    <a href="/" class="back-link">← กลับหน้าแรก</a>
  </div>
</div>

<script>
(function () {
  /* เบราว์เซอร์ในแอป (LINE/FB/IG) เปิด access.line.me เองด้วยเบราว์เซอร์
     คนละตัว/คนละ context เวลากดปุ่ม LINE Login ทำให้ sessionStorage ที่
     เก็บ state ไว้หายไปตอนเด้งกลับมา — แก้ไม่ได้ด้วยการเปลี่ยนที่เก็บ
     state (ลองมาแล้วทั้ง cookie และ sessionStorage) ต้องดีดผู้ใช้ออกไป
     เบราว์เซอร์จริงของเครื่องตั้งแต่ก่อนเข้าหน้านี้เลย ใช้พารามิเตอร์
     openExternalBrowser=1 ที่ LINE รู้จัก (รูปแบบเดียวกับ
     assets/js/certificate.js / ef-check.js ที่ใช้อยู่แล้วในโปรเจกต์นี้) */
  function isInAppBrowser() {
    return /Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger/i.test(navigator.userAgent || '');
  }
  const preParams = new URLSearchParams(location.search);
  if (isInAppBrowser() && !preParams.get('openExternalBrowser') && !preParams.get('code')) {
    const u = location.origin + location.pathname +
      (location.search ? location.search + '&' : '?') + 'openExternalBrowser=1';
    location.replace(u);
    return;
  }

  const params = new URLSearchParams(location.search);
  const err    = params.get('error');
  const loggedOut = params.get('logged_out');
  const lineCode  = params.get('code');
  const lineState = params.get('state');
  // ลิงก์ "เชื่อมบัญชี LINE" จากอีเมลยืนยันคำสั่งซื้อ — ดู email.js:connectLineUrl
  const connectToken = params.get('connect_token');

  /* need_email มาจาก JSON response ของ line-callback (ไม่ได้ redirect
     พร้อม query string เหมือนเดิมแล้ว) จึงเก็บ line_uid ไว้ใน
     sessionStorage แทนตัวแปรในหน่วยความจำล้วนๆ — มือถือหลายรุ่น reload
     แท็บ Safari ที่ถูก background ไว้ พอกลับมาตัวแปร JS หายหมด ทำให้
     ส่ง magic-link ไปโดยไม่มี line_uid ติดไปด้วย (เจอจริงจากข้อมูลใน DB —
     แถวที่ส่งมาล่าสุดก็ line_user_id เป็น null) sessionStorage รอดจาก
     reload หน้าเดิมได้ ตัวแปรในหน่วยความจำไม่รอด — ทางนี้ยังจำเป็นอยู่
     สำหรับเคสที่ LINE ไม่แชร์อีเมลมาเลยและไม่ได้มาจากลิงก์ connect_token */
  // ค่าเก่าใน sessionStorage อาจค้างมาจากรอบ need_email ก่อนหน้า (คนละวัน
  // คนละคำสั่งซื้อ) ถ้าตอนนี้มาจากลิงก์ "เชื่อมบัญชี LINE" (connectToken)
  // ซึ่งเป็นคนละ flow กันโดยสิ้นเชิง ต้องเคลียร์ทิ้ง ไม่งั้นหน้านี้จะโชว์
  // ข้อความ "LINE ไม่แชร์อีเมล" ผิดๆ ทันทีที่โหลด ทั้งที่ยังไม่ได้ลองกด
  // ปุ่ม LINE Login รอบนี้เลยด้วยซ้ำ
  if (connectToken) {
    try { sessionStorage.removeItem('vnk_need_email_line_uid'); } catch (e) {}
  }
  let storedLineUid = null;
  try { storedLineUid = connectToken ? null : sessionStorage.getItem('vnk_need_email_line_uid'); } catch (e) {}
  let lineUid   = params.get('line_uid') || storedLineUid;
  let needEmail = params.get('need_email') === '1' || !!lineUid;

  const msgBox = document.getElementById('msg-box');

  const ERROR_MSGS = {
    expired_link:        'ลิงก์หมดอายุแล้ว กรุณาขอลิงก์ใหม่',
    invalid_link:        'ลิงก์ไม่ถูกต้อง',
    line_not_configured: 'LINE Login ยังไม่พร้อมใช้งาน กรุณาใช้อีเมลแทน',
    line_state_mismatch: 'ลิงก์หมดอายุหรือไม่ถูกต้อง กรุณาลองใหม่',
    line_token_failed:   'เชื่อมต่อ LINE ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
    line_profile_failed: 'เชื่อมต่อ LINE ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
    internal:            'เกิดข้อผิดพลาดภายใน กรุณาลองใหม่'
  };

  if (loggedOut) showMsg('ออกจากระบบแล้ว', 'success');
  if (needEmail) {
    showMsg('LINE ของคุณไม่ได้แชร์อีเมล กรุณากรอกอีเมลที่ใช้สั่งซื้อแล้วกดรับลิงก์', 'error');
  } else if (connectToken && !lineCode) {
    showMsg('กดปุ่ม "เข้าสู่ระบบด้วย LINE" ด้านล่างเพื่อเชื่อมบัญชี LINE กับคำสั่งซื้อนี้', 'success');
  }
  if (err) showMsg(ERROR_MSGS[err] || 'เกิดข้อผิดพลาด: ' + err, 'error');

  /* ── LINE Login: state เซ็นด้วย HMAC ฝั่ง server (signed_token.js) —
     ไม่ต้องเก็บอะไรไว้ฝั่ง client เลยตอนนี้ ตรวจสอบได้เองจากลายเซ็น
     แก้ปัญหา state หายตอนแอป LINE เปิด redirect กลับมาคนละ context
     (ลองมาแล้วทั้ง cookie และ sessionStorage เจอปัญหาเดิมทุกครั้ง) */
  window.beginLineLogin = function () {
    const btn = document.getElementById('btn-line');
    btn.disabled = true;
    const qs = connectToken ? ('?connect_token=' + encodeURIComponent(connectToken)) : '';
    fetch('/api/auth/line-start' + qs)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) { showMsg(ERROR_MSGS[data.error] || 'เกิดข้อผิดพลาด', 'error'); btn.disabled = false; return; }
        location.href = data.authorizeUrl;
      })
      .catch(function () { showMsg('เกิดข้อผิดพลาด กรุณาลองใหม่', 'error'); btn.disabled = false; });
  };

  function completeLineLogin(code, state) {
    const btn = document.getElementById('btn-line');
    if (btn) btn.disabled = true;
    fetch('/api/auth/line-callback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: code, state: state, redirect_uri: location.origin + location.pathname })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.ok) { location.href = '/library'; return; }
        if (data.error === 'need_email') {
          needEmail = true;
          lineUid   = data.line_uid;
          try { sessionStorage.setItem('vnk_need_email_line_uid', lineUid || ''); } catch (e) {}
          showMsg('LINE ของคุณไม่ได้แชร์อีเมล กรุณากรอกอีเมลที่ใช้สั่งซื้อแล้วกดรับลิงก์', 'error');
        } else {
          showMsg(ERROR_MSGS[data.error] || 'เกิดข้อผิดพลาด: ' + data.error, 'error');
        }
        if (btn) btn.disabled = false;
      })
      .catch(function () {
        showMsg('เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
        if (btn) btn.disabled = false;
      });
  }

  if (lineCode) {
    history.replaceState({}, '', location.pathname);
    completeLineLogin(lineCode, lineState);
  }

  window.sendMagicLink = async function () {
    const email = document.getElementById('email-input').value.trim();
    const btn   = document.getElementById('btn-magic');

    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      return showMsg('กรุณากรอกอีเมลให้ถูกต้อง', 'error');
    }

    btn.disabled = true;
    btn.textContent = 'กำลังส่ง…';

    try {
      const body = needEmail ? { email, line_uid: lineUid } : { email };
      const r = await fetch('/api/auth/send-magic-link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await r.json();
      if (data.ok) {
        try { sessionStorage.removeItem('vnk_need_email_line_uid'); } catch (e) {}
        showMsg('ส่งลิงก์ไปที่ ' + email + ' แล้ว กรุณาตรวจกล่องจดหมาย (รวม Junk/Spam)', 'success');
        btn.textContent = 'ส่งแล้ว ✓';
      } else {
        throw new Error(data.error || 'send_failed');
      }
    } catch (e) {
      showMsg('ส่งไม่สำเร็จ: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = 'รับลิงก์เข้าสู่ระบบทางอีเมล';
    }
  };

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className   = 'msg-box ' + type;
    msgBox.style.display = 'block';
  }

  // Enter key
  document.getElementById('email-input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') window.sendMagicLink();
  });
})();
</script>
</body>
</html>
