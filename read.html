<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VINKO WOW LAB — อ่านนิทาน</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --accent: #e94560;
    --gold: #f5a623;
    --text: #eee;
    --muted: #888;
    /* ลดจาก 64px ~16% — ปุ่มวงกลม/pill ในแถบล่างก็ลดเหลือ 44px (ดู
       .ctrl-btn) ยังเกิน touch target ขั้นต่ำ 44px */
    --bar-h: 54px;
    /* ระบบ radius/shadow กลาง กันแต่ละปุ่มเลือกค่าคนละแบบโดยไม่มีเหตุผล */
    --radius-pill: 999px;
    --radius-sm: 10px;
    --shadow-sm: 0 2px 6px #0007;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Mitr', 'Anuphan', 'Sarabun', 'Noto Sans Thai', sans-serif;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ── Top bar ── */
  #topbar {
    height: var(--bar-h);
    background: var(--surface);
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 1px solid #ffffff18;
  }
  #btn-home {
    color: var(--text);
    font-size: 20px;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #ffffff18;
    flex-shrink: 0;
  }
  #btn-home:hover { background: #ffffff28; }
  #topbar .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 1px;
  }
  #topbar .story-title {
    font-size: 14px;
    color: var(--muted);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* bg music toggle */
  #btn-bgm {
    border: none;
    background: #ffffff18;
    color: var(--muted);
    font-size: 13px;
    padding: 10px 14px;
    min-height: 36px;
    border-radius: var(--radius-pill);
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  #btn-bgm.on { background: var(--gold); color: #000; }

  /* ── Page view ── */
  #stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: #000;

  }
  #page-img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    will-change: transform;
  }

  /* ลายน้ำกันแคปหน้าจอแล้วแชร์ต่อโดยไม่มีร่องรอย (เหมือน PDF ที่มีลายน้ำ
     อยู่แล้ว) — mix-blend-mode:difference ทำให้ตัวอักษรมองเห็นได้เสมอ
     ไม่ว่าพื้นหลังภาพประกอบจะสีอ่อนหรือเข้ม โดยไม่ต้องสลับสีเอง
     pointer-events:none กันไม่ให้บังปุ่มกดที่ซ้อนอยู่ด้านบน */
  #watermark-layer {
    position: absolute;
    inset: 0;
    z-index: 6;
    pointer-events: none;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    mix-blend-mode: difference;
    opacity: .22;
  }

  /* Page transition — slow fade in */
  @keyframes pageFadeIn { from { opacity: 0; } to { opacity: 1; } }
  .page-fade-in { animation: pageFadeIn 800ms ease-out forwards; }

  /* nav arrows — เก็บไว้บนจอกว้าง (desktop/iPad) เป็นทางลัด, บนมือถือซ่อน
     เพราะซ้ำซ้อนกับปุ่ม prev/next ใน bottom bar อยู่แล้ว (ทั้งคู่เรียก
     goPage() ตัวเดียวกัน) — mobile ยังมี swipe รองรับด้วย */
  .nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #00000055;
    border: none;
    color: #fff;
    font-size: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .2s, opacity .2s;
    opacity: .7;
    z-index: 10;
  }
  .nav-btn:hover { background: #00000090; opacity: 1; }
  .nav-btn:disabled { opacity: 0.15; cursor: default; }
  #btn-prev { left: 10px; }
  #btn-next { right: 10px; }
  @media (max-width: 767px) {
    .nav-btn { display: none; }
  }

  /* page counter — มุมบนซ้าย กันชนกับปุ่มไทย/English ที่ลอยอยู่มุมล่าง
     (เดิมอยู่กึ่งกลางล่าง ซ้อนทับปุ่มภาษาที่ใหญ่กว่า มองเลขหน้าไม่เห็น) */
  #page-counter {
    position: absolute;
    top: 12px;
    left: 12px;
    background: #00000070;
    color: #ffffffbb;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: var(--radius-pill);
    pointer-events: none;
  }

  /* language overlay buttons — ย่อเล็กลง + ย้ายไปมุมขวาล่างของหนังสือ
     กันไม่ให้บังภาพตรงกลางเหมือนตอนอยู่กึ่งกลางด้านล่าง
     ใช้ clamp() ผูกกับ vw แทนตัวเลขคงที่ เพราะจอคอม/iPad กว้างกว่ามือถือมาก
     ถ้าปล่อยขนาด mobile ไว้ ปุ่มจะดูจิ๋วเทียบกับภาพหนังสือที่ขยายใหญ่ตาม */
  #lang-overlay {
    position: absolute;
    bottom: clamp(12px, 2vw, 22px);
    right: clamp(12px, 2vw, 22px);
    display: flex;
    gap: clamp(6px, 1vw, 12px);
    z-index: 10;
  }
  .lang-btn {
    border: none;
    cursor: pointer;
    border-radius: clamp(20px, 3vw, 30px);
    padding: clamp(5px, 1vw, 10px) clamp(11px, 2.2vw, 22px);
    font-size: clamp(11px, 1.6vw, 16px);
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(4px, 0.6vw, 8px);
    /* ความกว้างขั้นต่ำเท่ากันทั้งคู่ — "English" ยาวกว่า "ไทย" มาก
       ถ้าปล่อยตาม content เฉยๆ ปุ่มจะดูไม่สมดุลกัน */
    min-width: clamp(64px, 9vw, 96px);
    backdrop-filter: blur(6px);
    transition: all .2s;
    box-shadow: var(--shadow-sm);
  }
  .lang-btn.th-btn {
    /* เดิมใช้ #a50d3b คนละเฉดกับ --accent ที่ปุ่มเล่นใช้ — รวมเป็นสีแดง
       เฉดเดียวกันทั้งไฟล์ (เลขเดียวกับ --accent ตอน hover) ไม่ให้มีสีแดง/
       ชมพู 2 เฉดแข่งกัน — เขียนเป็น hex ตรงๆ แทน color-mix() กัน LINE
       in-app webview รุ่นเก่าที่ยังไม่รองรับฟังก์ชันนี้ */
    background: #c73350cc;
    color: #fff;
  }
  .lang-btn.en-btn {
    background: #003894cc;
    color: #fff;
  }
  .lang-btn.playing {
    box-shadow: 0 0 0 3px #fff6, 0 2px 8px #0006;
    transform: scale(1.06);
  }
  .lang-btn:disabled {
    opacity: 0.3;
    cursor: default;
    transform: none;
  }
  .lang-btn .flag { font-size: clamp(13px, 1.8vw, 19px); line-height: 1; }

  /* audio status — เดิมเป็น pill ข้อความเต็ม "กำลังเล่น..." ซึ่งซ้ำซ้อนกับ
     ไอคอน play/pause ที่เปลี่ยนรูปอยู่แล้ว ลดเหลือ badge เล็กมาก แค่
     ยืนยันว่ากำลังมีเสียงอยู่ ไม่ใช่ control หลัก */
  #audio-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: #00000070;
    color: #ffffffbb;
    font-size: 12px;
    line-height: 1;
    padding: 6px;
    width: 24px;
    height: 24px;
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    pointer-events: none;
  }
  #audio-badge.visible { display: flex; }

  /* ── Bottom bar ──
     LINE in-app browser (และ iOS มือถือทั่วไป) มี browser chrome/home
     indicator ชิดขอบล่างจอ ปุ่มเดิมไม่มี safe-area padding เลยรู้สึกติด/
     ถูกบัง — เพิ่ม env(safe-area-inset-bottom) เป็น padding และบวกเข้า
     height ด้วย calc() กัน padding ไปกินพื้นที่ปุ่มแทน (มี fallback 0px
     สำหรับ browser ที่ไม่รองรับ) */
  #bottombar {
    height: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-shrink: 0;
    border-top: 1px solid #ffffff18;
    padding: 0 16px calc(env(safe-area-inset-bottom, 0px));
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 20px;
    cursor: pointer;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s;
  }
  .ctrl-btn svg { width: 20px; height: 20px; display: block; }
  .ctrl-btn:hover { background: #ffffff14; }
  .ctrl-btn:disabled { opacity: .3; cursor: default; }
  .ctrl-btn:disabled:hover { background: none; }

  /* Play/Pause — เดิมสีชมพู/แดงจัด #e94560 ขนาด 58px แย่ง attention จาก
     ภาพหนังสือมากเกินไป (ดูเหมือนปุ่ม record/emergency) ลดขนาดลง ~20%
     และเปลี่ยนพื้นเป็น navy ของ surface เข้ม + ขอบบาง ให้ accent สื่อผ่าน
     ไอคอนแทนพื้นทั้งวง ยังหาเจอง่ายเพราะใหญ่กว่าปุ่มข้างๆ อยู่ดี */
  #btn-play-pause {
    width: 46px;
    height: 46px;
    background: var(--surface);
    border: 2px solid var(--accent);
    color: var(--accent);
    border-radius: 50%;
    flex-shrink: 0;
  }
  #btn-play-pause svg { width: 18px; height: 18px; }
  #btn-play-pause:hover { background: #ffffff10; }
  #btn-play-pause:disabled { border-color: #555; color: #555; }

  /* "ต่อเนื่อง" — เดิมเป็นวงกลม 48px + label ลอยด้วย absolute ใต้ปุ่ม ซึ่ง
     ชนขอบล่างของ #bottombar พอดี (label สูงกว่าระยะขอบที่มีจริง ~13px
     ทำให้ body{overflow:hidden} ตัดข้อความทิ้งเกือบหมด) — เปลี่ยนเป็น pill
     แนวนอน icon+ข้อความอยู่ในบรรทัดเดียว สูงเท่า .ctrl-btn วงกลมอื่น (44px)
     พอดี ทำให้ baseline ตรงกับปุ่มข้างๆ โดยธรรมชาติ ไม่ต้องใช้ absolute
     positioning เลย และเห็น label ได้ตลอดเวลาไม่ใช่แค่ตอน active */
  .auto-pill {
    width: auto;
    padding: 0 14px 0 11px;
    border-radius: var(--radius-pill);
    gap: 6px;
  }
  .auto-pill .auto-icon { font-size: 18px; line-height: 1; }
  .auto-label {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  /* เดิมตอน ON เปลี่ยนแค่สี icon เป็น gold — subtle เกินไป ผู้ใช้อาจไม่ทัน
     สังเกต เพิ่ม background pill จางๆ ให้ต่างจากสถานะ OFF ชัดขึ้น ไม่พึ่ง
     สีอย่างเดียว (label ข้อความเปลี่ยนอยู่แล้วด้วย) */
  #btn-auto.on {
    color: var(--gold);
    background: #f5a62322;
  }
  #btn-auto.on .auto-label { color: var(--gold); }

  /* progress bar */
  #progress-wrap {
    position: absolute;
    bottom: calc(var(--bar-h) + env(safe-area-inset-bottom, 0px));
    left: 0;
    right: 0;
    height: 3px;
    background: #ffffff20;
  }
  /* เดิมใช้ --accent (แดง/ชมพู) ตัวเดียวกับปุ่มเล่น ทำให้สีแดงโผล่ซ้ำอีกจุด
     บนจอเดียวกันตลอดเวลา เปลี่ยนเป็น gold ให้บทบาท "accent" ไม่ทับกัน */
  #progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width .3s;
  }

  /* loading overlay */
  #loading-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 100;
  }
  #loading-screen.hidden { display: none; }
  .spinner {
    width: 40px;
    height: 40px;
    border: 4px solid #ffffff22;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* error */
  #error-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 32px;
    z-index: 100;
  }
  #error-screen.hidden { display: none; }
  #error-screen h2 { color: var(--accent); }

  /* locked — ต้อง fixed+overlay แบบเดียวกับ error-screen และต้องมี
     .hidden ของตัวเอง (แต่ก่อนไม่มี #locked-screen.hidden เลย แปลว่า
     div นี้โชว์ตลอดไม่ว่า checkAccess จะผ่านหรือไม่ก็ตาม ซ้อนทับอยู่
     เหนือ topbar/stage แบบ block ธรรมดาเสมอ ไม่ใช่ overlay ด้วยซ้ำ) */
  #locked-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    padding: 32px;
    z-index: 100;
  }
  #locked-screen.hidden { display: none; }
</style>
</head>
<body>

<!-- Loading -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p style="color:var(--muted)">กำลังโหลด...</p>
</div>

<!-- Error -->
<div id="error-screen" class="hidden">
  <h2>ไม่พบนิทาน</h2>
  <p style="color:var(--muted)">ลิงก์ไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง</p>
  <a href="/" style="color:var(--accent)">กลับหน้าหลัก</a>
</div>

<!-- Locked -->
<div id="locked-screen" class="hidden">
  <div style="font-size:48px;margin-bottom:16px;">🔒</div>
  <h2 style="color:var(--accent);margin-bottom:8px;">หนังสือเสียงนี้สำหรับผู้ซื้อเท่านั้น</h2>
  <p style="color:var(--muted);margin-bottom:24px;">กรุณาเปิดลิงก์จากอีเมลยืนยันการสั่งซื้อของคุณ</p>
  <a href="https://vinko.quest" style="color:var(--accent);font-weight:bold;">ไปหน้าหลัก</a>
</div>

<!-- Top bar -->
<div id="topbar">
  <a id="btn-home" href="/library?openExternalBrowser=1" title="กลับไปชั้นหนังสือของฉัน">&#8249;</a>
  <span class="logo">VINKO</span>
  <span id="story-title" class="story-title">WOW LAB</span>
  <button id="btn-bgm" onclick="toggleBgm()" title="ดนตรีประกอบ">♪ ดนตรี</button>
</div>

<!-- Stage -->
<div id="stage">
  <button class="nav-btn" id="btn-prev" onclick="goPage(-1)">&#8249;</button>
  <img id="page-img" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" alt="หน้าหนังสือ" draggable="false">
  <div id="watermark-layer"></div>
  <button class="nav-btn" id="btn-next" onclick="goPage(1)">&#8250;</button>
  <div id="page-counter">1 / 1</div>
  <div id="audio-badge" title="กำลังเล่นเสียง">🔊</div>

  <!-- Language audio buttons overlaid on image -->
  <div id="lang-overlay">
    <button class="lang-btn th-btn" id="btn-play-th" onclick="playLang('th')" disabled>
      <span class="flag">🇹🇭</span> ไทย
    </button>
    <button class="lang-btn en-btn" id="btn-play-en" onclick="playLang('en')" disabled>
      <span class="flag">🇬🇧</span> English
    </button>
  </div>
</div>

<!-- Progress -->
<div id="progress-wrap">
  <div id="progress-fill" style="width:0%"></div>
</div>

<!-- Bottom bar -->
<div id="bottombar">
  <!-- เดิมใช้ ❮❮ ❯❯ (double chevron) สื่อ rewind/fast-forward แบบ media
       player — แต่ function จริงคือเปลี่ยนหน้าเฉยๆ ไม่มีการ seek เสียง
       เปลี่ยนเป็น chevron เดี่ยวตัวเดียวกับลูกศรข้างภาพ ให้สื่อ "หน้าก่อน/
       หน้าถัดไป" ชัดกว่า -->
  <button class="ctrl-btn" id="btn-rew" onclick="goPage(-1)" title="หน้าก่อน">&#8249;</button>
  <button class="ctrl-btn" id="btn-play-pause" onclick="togglePlay()" title="เล่น/หยุด"></button>
  <button class="ctrl-btn" id="btn-fwd" onclick="goPage(1)" title="หน้าถัดไป">&#8250;</button>
  <button class="ctrl-btn auto-pill" id="btn-auto" onclick="toggleAuto()" title="เล่นต่อเนื่องอัตโนมัติ">
    <span class="auto-icon">&#8635;</span><span class="auto-label" id="auto-label">ต่อเนื่อง</span>
  </button>
</div>

<audio id="player" preload="none"></audio>
<audio id="bgm" loop preload="none"></audio>

<script>
// ── Config ───────────────────────────────────────────────────────────────────
const SB = 'https://snhfobhkrkuntohybnrh.supabase.co/storage/v1/object/public/story-reader';
const SB_URL = 'https://snhfobhkrkuntohybnrh.supabase.co';
const SB_KEY = 'sb_publishable_QbQ2cvGe5cfFcV61FhEtjQ_KbVsYKZ_';

// Page manifest per story.
// img: image filename, audio: audio base name (null = no audio for this page)
// audio naming: {base}_th.wav and {base}_en.wav
// Background music URL — ใส่ URL เพลงที่นี่เมื่อมีไฟล์
const BGM_URL = 'https://snhfobhkrkuntohybnrh.supabase.co/storage/v1/object/public/story-reader/bgm/background.mp3';

// extra: page-index (0-based) → { audio: basename, bi: bilingual (has _en.wav) }
const STORIES = {
  '1': { title: 'นิทานเล่ม 1', pages: buildPages(20, 14, 2), extra: {
    0:  { audio: 'extra_cover',    bi: false },
    1:  { audio: 'extra_chars',    bi: false },
    17: { audio: 'extra_newwords', bi: false },
    18: { audio: 'extra_parents',  bi: false },
  }},
  '2': { title: 'นิทานเล่ม 2', pages: buildPages(21, 14, 2), extra: {
    0:  { audio: 'extra_cover',              bi: false },
    1:  { audio: 'extra_chars',              bi: false },
    16: { audio: 'extra_newwords',           bi: false },
    17: { audio: 'extra_page11_tryit',       bi: true  },
    18: { audio: 'extra_page10_sciencepopup', bi: true  },
    19: { audio: 'extra_parents',            bi: false },
  }},
  '3': { title: 'นิทานเล่ม 3', pages: buildPages(20, 14, 2), extra: {
    0:  { audio: 'extra_cover',    bi: false },
    1:  { audio: 'extra_chars',    bi: false },
    16: { audio: 'extra_wowlab',   bi: true  },
    17: { audio: 'extra_newwords', bi: false },
    18: { audio: 'extra_parents',  bi: false },
  }},
  '4': { title: 'นิทานเล่ม 4', pages: buildPages(21, 14, 2), extra: {
    0:  { audio: 'extra_cover',          bi: false },
    1:  { audio: 'extra_chars',          bi: false },
    16: { audio: 'extra_newwords',       bi: false },
    17: { audio: 'extra_tryityourself',  bi: true  },
    18: { audio: 'extra_sciencecorner',  bi: true  },
    19: { audio: 'extra_parents',        bi: false },
  }},
  '5': { title: 'นิทานเล่ม 5', pages: buildPages(21, 14, 2), extra: {
    0:  { audio: 'extra_cover',          bi: false },
    1:  { audio: 'extra_chars',          bi: false },
    16: { audio: 'extra_newwords',       bi: false },
    17: { audio: 'extra_tryityourself',  bi: true  },
    18: { audio: 'extra_sciencecorner',  bi: true  },
    19: { audio: 'extra_parents',        bi: false },
  }},
};

// buildPages: image pages 1..total, audio pages 1..audioCount (1-indexed, offset shifts which image starts audio)
function buildPages(total, audioCount, audioStartAt) {
  return Array.from({ length: total }, (_, i) => {
    const n = i + 1;
    const audioIdx = n - audioStartAt;
    const hasAudio = audioIdx >= 1 && audioIdx <= audioCount;
    return {
      img: `page-${String(n).padStart(2,'0')}.png`,
      audio: hasAudio ? `page${String(audioIdx).padStart(2,'0')}` : null
    };
  });
}

// ── State ─────────────────────────────────────────────────────────────────────
const params  = new URLSearchParams(location.search);
const storyId = params.get('story') || '1';
let story, currentLang = 'th', currentPage = 0, autoPlay = false, playing = false, bgmOn = false;
let curAudioBase = null, curAudioBi = true;  // set in showPage, read by playLang/startAudio

const player    = document.getElementById('player');
const bgmEl     = document.getElementById('bgm');
const imgEl     = document.getElementById('page-img');
const counter   = document.getElementById('page-counter');
const fill      = document.getElementById('progress-fill');
const btnPlay   = document.getElementById('btn-play-pause');
const btnAuto   = document.getElementById('btn-auto');
const audioBadge= document.getElementById('audio-badge');
const loadingEl = document.getElementById('loading-screen');
const errorEl   = document.getElementById('error-screen');
const btnPlayTh = document.getElementById('btn-play-th');
const btnPlayEn = document.getElementById('btn-play-en');

// ── Init ──────────────────────────────────────────────────────────────────────
function init() {
  story = STORIES[storyId];
  if (!story) { showError(); return; }

  document.getElementById('story-title').textContent = story.title;
  document.title = `VINKO — ${story.title}`;

  const startPage = parseInt(params.get('p') || '1', 10) - 1;
  currentPage = Math.max(0, Math.min(startPage, story.pages.length - 1));

  showPage(currentPage, () => {
    loadingEl.classList.add('hidden');
  });

  // swipe support
  let tx = 0;
  const stage = document.getElementById('stage');
  stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tx;
    if (Math.abs(dx) > 40) goPage(dx < 0 ? 1 : -1);  // goPage already passes flipDir
  }, { passive: true });

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goPage(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   goPage(-1);
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  });

  // audio events
  player.addEventListener('ended', () => {
    setPlayIcon(false);
    playing = false;
    audioBadge.classList.remove('visible');
    updateLangButtons(false);
    if (autoPlay && currentPage < story.pages.length - 1) {
      setTimeout(() => goPage(1), 800);
    }
  });
  player.addEventListener('play',  () => { setPlayIcon(true);  audioBadge.classList.add('visible'); });
  player.addEventListener('pause', () => { setPlayIcon(false); audioBadge.classList.remove('visible'); updateLangButtons(false); });
  player.addEventListener('error', () => { setPlayIcon(false); playing = false; btnPlay.disabled = true; updateLangButtons(false); });

  // bgm setup
  if (BGM_URL) {
    bgmEl.src = BGM_URL;
    bgmEl.volume = 0.25;
    document.getElementById('btn-bgm').style.display = '';
  } else {
    document.getElementById('btn-bgm').style.display = 'none';
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
function goPage(delta) {
  const next = currentPage + delta;
  if (next < 0 || next >= story.pages.length) return;
  stopAudio();
  showPage(next, null, delta > 0 ? 'fwd' : 'bck');
}

function showPage(idx, onLoad, flipDir) {
  currentPage = idx;
  const pg = story.pages[idx];

  function loadImg() {
    imgEl.onload = () => {
      imgEl.classList.remove('page-fade-in');
      void imgEl.offsetWidth;
      imgEl.classList.add('page-fade-in');
      if (onLoad) onLoad();
      if (autoPlay && curAudioBase) startAudio();
    };
    imgEl.onerror = () => { if (onLoad) onLoad(); };
    imgEl.src = `${SB}/images/STORY-0${storyId}/${pg.img}`;
  }

  loadImg();

  // ui
  counter.textContent = `${idx + 1} / ${story.pages.length}`;
  fill.style.width = `${((idx + 1) / story.pages.length) * 100}%`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === story.pages.length - 1;
  document.getElementById('btn-rew').disabled  = idx === 0;
  document.getElementById('btn-fwd').disabled  = idx === story.pages.length - 1;

  // audio — story pages use pg.audio; special pages fall back to story.extra[idx]
  const xtra = story.extra && story.extra[idx];
  curAudioBase = pg.audio || (xtra && xtra.audio) || null;
  curAudioBi   = pg.audio ? true : (xtra ? xtra.bi : true);
  const hasAudio = !!curAudioBase;
  btnPlay.disabled    = !hasAudio;
  btnPlayTh.disabled  = !hasAudio;
  btnPlayEn.disabled  = !hasAudio || !curAudioBi;
  if (hasAudio) {
    const lang = curAudioBi ? currentLang : 'th';
    player.src = `${SB}/audio/STORY-0${storyId}/${curAudioBase}_${lang}.wav`;
    player.load();
    playing = false;
    setPlayIcon(false);
    updateLangButtons(false);
  } else {
    player.src = '';
    setPlayIcon(false);
    playing = false;
    updateLangButtons(false);
  }

  // update URL without reload
  history.replaceState(null, '', `?story=${storyId}&p=${idx + 1}`);
}

// ── Audio controls ────────────────────────────────────────────────────────────
function togglePlay() {
  if (!player.src || btnPlay.disabled) return;
  if (playing) {
    player.pause();
    playing = false;
  } else {
    player.play().then(() => { playing = true; updateLangButtons(true); }).catch(() => {});
  }
}

function startAudio() {
  if (!curAudioBase) return;
  const lang = curAudioBi ? currentLang : 'th';
  player.src = `${SB}/audio/STORY-0${storyId}/${curAudioBase}_${lang}.wav`;
  player.load();
  player.play().then(() => { playing = true; updateLangButtons(true); }).catch(() => {});
}

function stopAudio() {
  player.pause();
  player.currentTime = 0;
  playing = false;
  audioBadge.classList.remove('visible');
  setPlayIcon(false);
}

// ใช้ inline SVG แทน unicode ▶/▮▮ — ▶ ของฟอนต์ไม่ optical-center (เห็นเอียง
// ไปทางซ้ายในวงกลม) จุดสามเหลี่ยม path นี้เยื้องขวา 1 unit จากกึ่งกลาง
// bounding box โดยตั้งใจ เพื่อชดเชยน้ำหนักภาพที่เอียงซ้ายตามธรรมชาติของรูปสามเหลี่ยม
const ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 6L8 18L18 12Z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="6" width="3.5" height="12"/><rect x="13.5" y="6" width="3.5" height="12"/></svg>';
function setPlayIcon(isPlaying) {
  btnPlay.innerHTML = isPlaying ? ICON_PAUSE : ICON_PLAY;
}

// ── Language buttons on image ─────────────────────────────────────────────────
function playLang(l) {
  if (!curAudioBase) return;
  if (!curAudioBi && l === 'en') return;  // TH-only page

  // If already playing this lang → pause
  if (playing && currentLang === l) {
    player.pause();
    return;
  }

  currentLang = l;
  stopAudio();
  const lang = curAudioBi ? l : 'th';
  player.src = `${SB}/audio/STORY-0${storyId}/${curAudioBase}_${lang}.wav`;
  player.load();
  player.play().then(() => {
    playing = true;
    updateLangButtons(true);
  }).catch(() => {});
}

function updateLangButtons(isPlaying) {
  btnPlayTh.classList.toggle('playing', isPlaying && currentLang === 'th');
  btnPlayEn.classList.toggle('playing', isPlaying && currentLang === 'en');
}

// ── Background music ──────────────────────────────────────────────────────────
function toggleBgm() {
  bgmOn = !bgmOn;
  document.getElementById('btn-bgm').classList.toggle('on', bgmOn);
  if (bgmOn) {
    bgmEl.play().catch(() => {});
  } else {
    bgmEl.pause();
  }
}

// ── Auto-play ─────────────────────────────────────────────────────────────────
function toggleAuto() {
  autoPlay = !autoPlay;
  btnAuto.classList.toggle('on', autoPlay);
  document.getElementById('auto-label').textContent = autoPlay ? 'เปิดอยู่' : 'ต่อเนื่อง';
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function showError() {
  loadingEl.classList.add('hidden');
  errorEl.classList.remove('hidden');
}

function showLocked() {
  loadingEl.classList.add('hidden');
  document.getElementById('locked-screen').classList.remove('hidden');
}

async function checkAccess(token, story) {
  try {
    const r = await fetch(SB_URL + '/rest/v1/rpc/check_reader_access', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SB_KEY,
        'Authorization': 'Bearer ' + SB_KEY
      },
      body: JSON.stringify({ p_token: token, p_story: parseInt(story, 10) })
    });
    if (!r.ok) return false;
    return await r.json();
  } catch (e) {
    return false;
  }
}

function escXml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// เรียกแยกจาก checkAccess (คนละ endpoint คนละจุดประสงค์) — ขอลิงก์ไม่ได้ก็แค่
// ไม่มีลายน้ำ ไม่บล็อกการอ่านของลูกค้า (checkAccess ต่างหากที่เป็นด่านสิทธิ์จริง)
// เดิม tile ลายน้ำซ้ำเต็มหน้า (background-repeat:repeat) ทำให้ตัวหนังสือ
// พาดผ่านภาพประกอบ/ใบหน้าตัวละครหลายจุดมาก ดูเหมือนไฟล์ proof มากกว่า
// สินค้าที่ซื้อแล้ว — เปลี่ยนเป็น 3 ตำแหน่งคงที่แบบทแยง (บนซ้าย/กลาง/
// ล่างขวา) ไม่ทับกึ่งกลางภาพที่มักเป็นตัวละคร/ข้อความหลัก, ลด opacity
// ใน CSS ไปแล้วด้วย (.22 จากเดิม .4) ยังพอเห็นได้เวลาแคปหน้าจอ
async function applyWatermark(token) {
  try {
    const r = await fetch('/api/download-info?rtoken=' + encodeURIComponent(token));
    const d = await r.json();
    if (!d || !d.ok || !d.watermark) return;
    const label = escXml(d.watermark);
    const spots = [
      { x: 40,  y: 130, rot: -27 },
      { x: 430, y: 620, rot: -27 },
      { x: 120, y: 1120, rot: -27 }
    ];
    const texts = spots.map(function (s) {
      return '<text x="' + s.x + '" y="' + s.y + '" transform="rotate(' + s.rot + ' ' + s.x + ' ' + s.y + ')" ' +
        'font-family="sans-serif" font-size="15" fill="#fff">' + label + '</text>';
    }).join('');
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 1240">' + texts + '</svg>';
    document.getElementById('watermark-layer').style.backgroundImage =
      'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  } catch (e) { /* เงียบไว้ ลายน้ำเป็นแค่ตัวป้องกันเสริม ไม่ใช่ด่านหลัก */ }
}

async function start() {
  const token = params.get('token');
  if (!token) { showLocked(); return; }
  const ok = await checkAccess(token, storyId);
  if (!ok) { showLocked(); return; }
  applyWatermark(token);
  init();
}

start();
</script>
